<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(148, 163, 184, 0.13) 1px, transparent 0) 0 0 / 28px 28px,
      linear-gradient(135deg, #0b0f17 0%, #0f172a 55%, #0b1220 100%);
    color: #e2e8f0;
    position: relative;
  }
  .glow {
    position: absolute; right: -120px; top: 40px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.18), transparent 62%);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
  .label {
    display: inline-block; font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.16em; text-transform: uppercase; color: #22d3ee;
    border: 1px solid rgba(34, 211, 238, 0.45); border-radius: 999px; padding: 8px 16px;
  }
  h1 { margin-top: 28px; font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; color: #f8fafc; }
  h1 span { color: #22d3ee; }
  .sub { margin-top: 24px; font-size: 28px; line-height: 1.35; color: #cbd5e1; max-width: 560px; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e2e8f0;
    background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(100, 116, 139, 0.6);
    border-radius: 10px; padding: 9px 14px;
  }
  .url {
    position: absolute; left: 72px; bottom: 54px;
    font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #94a3b8;
  }
  .url b { color: #f8fafc; font-weight: 700; }
  svg.tree { position: absolute; right: 56px; top: 96px; width: 500px; height: 440px; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="copy">
    <span class="label">Para professores e estudantes</span>
    <h1>AI Tech Tree<br><span>&amp; Knowledge</span></h1>
    <p class="sub">A evolução da inteligência artificial numa árvore interativa, do machine learning clássico à superinteligência teórica.</p>
    <div class="chips">
      <span class="chip">51 habilidades</span>
      <span class="chip">T1 → T5</span>
      <span class="chip">Gratuito · MIT</span>
    </div>
  </div>

  <svg class="tree" id="tree" viewBox="0 0 500 440" aria-hidden="true"></svg>

  <div class="url">mrjc01.github.io/<b>ai-tree</b></div>

<script>
  // Mini-árvore decorativa: hexágonos planos ligados por trilhas ortogonais, nas cores do app.
  const R = 50;
  const W = Math.sqrt(3) * R;   // largura de um hexágono plano (flat-top) com raio R
  const H = 2 * R;
  const nodes = [
    { x: 250, y: 60,  c: '#f472b6', t: 'Multimodal' },
    { x: 360, y: 60,  c: '#a78bfa', t: 'Agentes' },
    { x: 140, y: 170, c: '#60a5fa', t: 'Transformer' },
    { x: 250, y: 170, c: '#34d399', t: 'LLM' },
    { x: 360, y: 170, c: '#fbbf24', t: 'RLHF' },
    { x: 60,  y: 280, c: '#f472b6', t: 'CNN' },
    { x: 170, y: 280, c: '#22d3ee', t: 'Atenção' },
    { x: 280, y: 280, c: '#a3e635', t: 'LSTM' },
    { x: 60,  y: 390, c: '#fb7185', t: 'Perceptron' },
    { x: 200, y: 390, c: '#818cf8', t: 'Backprop' },
    { x: 340, y: 390, c: '#2dd4bf', t: 'Embeddings' },
  ];
  const edges = [[8,5],[8,6],[9,6],[9,7],[10,7],[5,2],[6,2],[7,3],[2,3],[3,4],[3,1],[4,0],[2,0],[1,4]];
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('tree');
  const el = (name, attrs, parent = svg) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // Trilhas primeiro, para ficarem por baixo dos hexágonos.
  for (const [a, b] of edges) {
    const p = nodes[a], q = nodes[b];
    const y1 = p.y + R * 0.87, y2 = q.y - R * 0.87;
    const ym = (y1 + y2) / 2;
    el('path', {
      d: `M ${p.x} ${y1} V ${ym} H ${q.x} V ${y2}`,
      fill: 'none', stroke: 'rgba(148,163,184,0.45)', 'stroke-width': 2, 'stroke-linejoin': 'round'
    });
  }

  const hexPoints = (cx, cy, r) =>
    [0, 1, 2, 3, 4, 5].map(i => {
      const a = Math.PI / 180 * (60 * i);
      return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
    }).join(' ');

  for (const n of nodes) {
    el('polygon', { points: hexPoints(n.x, n.y, R), fill: '#111827', stroke: n.c, 'stroke-width': 3 });
    el('polygon', { points: hexPoints(n.x, n.y, R - 9), fill: 'none', stroke: n.c, 'stroke-opacity': 0.25, 'stroke-width': 1.5 });
    el('circle', { cx: n.x, cy: n.y - 24, r: 4.5, fill: n.c });
    const t = el('text', {
      x: n.x, y: n.y + 6, 'text-anchor': 'middle',
      'font-family': 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif',
      'font-size': 12.5, 'font-weight': 700, fill: '#e2e8f0'
    });
    t.textContent = n.t;
  }
</script>
</body>
</html>
